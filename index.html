<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Layout: one NES-resolution stage (256 x 240) scaled to the largest whole multiple that fits,
   centered on a black field. Touch controls dock below (portrait kiosk) or beside (landscape). */
:root{
  --field:#000000;
  --ink:#FFFFFF;
  --u:4px;                 /* one game pixel, set by script */
  --font:'Proxima Nova','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--field);color:var(--ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:default}
#app{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1024px;height:960px;background:var(--field)}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:8px;transition:opacity .3s}
#tools.idle{opacity:0;pointer-events:none}
body.nocursor,body.nocursor *{cursor:none!important}
.tool{width:36px;height:36px;border:2px solid var(--ink);background:var(--field);color:var(--ink);padding:0;display:grid;place-items:center;cursor:pointer;font:700 10px/1 var(--font);letter-spacing:.1em}
.tool:focus-visible,.pb:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tool svg{width:18px;height:18px;display:block}
.pb{position:absolute;border:3px solid var(--ink);background:var(--field);color:var(--ink);font:900 22px/1 var(--font);letter-spacing:.1em;
  display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.pb.on{background:var(--ink);color:var(--field)}
#dpad{position:absolute;touch-action:none}
#dpad .arm{position:absolute;border:3px solid var(--ink);background:var(--field);box-sizing:border-box}
#dpad .arm.on{background:var(--ink)}
#dpad .hub{position:absolute;background:var(--ink)}
#pad[hidden],#logo-src,#waves-src{display:none!important}
@media (prefers-reduced-motion: reduce){#tools{transition:none}}
</style>
</head>

<script>
'use strict';
(function(){
/* =====================================================================
   MOC SERVICE DRIVE // MAP 1
   NES-style platformer for the MOC booth, NADA Show 2027.
   Binary palette only: every pixel drawn is #000000 or #FFFFFF.
   Shaded in six NES-style grays. Original characters and art throughout.
   ===================================================================== */
const W=256, H=240, TS=16, LH=15;
const cv=document.getElementById('screen');
const ctx=cv.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;

/* ---------------- palette + sprite tools ----------------
   Six NES-style grays. Sprites are strings: k black, d dark, m mid, l light, w white, . clear
   ('#' and 'x' are kept as white and black for the 1-bit logo). */
const COL={k:'#000000',d:'#404040',m:'#787878',l:'#BCBCBC',w:'#FCFCFC',sky:'#5C94FC'};
const GRAY={k:'#000000',d:'#404040',m:'#787878',l:'#BCBCBC',w:'#FCFCFC','#':'#FCFCFC',x:'#000000',g:'#404040',t:'#404040',y:'#FCFCFC',z:'#FCFCFC'};
const WHITE=COL.w, BLACK=COL.k;
const HEXC={}; const rgbOf=hx=>HEXC[hx]||(HEXC[hx]=[parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16)]);
function bitmap(rows,w,h,map,invert){
  map=map||GRAY;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); const id=g.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const hx=map[rows[y][x]]; if(!hx) continue; let col=rgbOf(hx); if(invert) col=[255-col[0],255-col[1],255-col[2]];
    const i=(y*w+x)*4; id.data[i]=col[0];id.data[i+1]=col[1];id.data[i+2]=col[2];id.data[i+3]=255;
  }
  g.putImageData(id,0,0); return c;
}
/* mk(rows, palette, powerPalette): letters map to colors per sprite, like NES sprite palettes. */
function mk(rows,pal,pow){
  const h=rows.length,w=rows[0].length;
  rows.forEach((r,i)=>{if(r.length!==w)throw new Error('sprite row '+i+' is '+r.length+' wide, expected '+w+': '+r);});
  const fl=rows.map(r=>r.split('').reverse().join(''));
  const m=Object.assign({},GRAY,pal||{}), pm=pow?Object.assign({},m,pow):m;
  return {w,h,rows,n:bitmap(rows,w,h,m),f:bitmap(fl,w,h,m),i:bitmap(rows,w,h,m,true),fi:bitmap(fl,w,h,m,true),p:bitmap(rows,w,h,pm),fp:bitmap(fl,w,h,pm)};
}
function tint(s,pal,pow){ Object.assign(s,mk(s.rows,pal,pow)); return s; }
function grid(w,h){
  const a=Array.from({length:h},()=>Array(w).fill('.'));
  return {w,h,a,
    set(x,y,c='w'){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)a[y][x]=c;},
    get(x,y){return (x>=0&&y>=0&&x<w&&y<h)?a[y][x]:'.';},
    rect(x,y,ww,hh,c='w'){for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)this.set(x+i,y+j,c);},
    line(x0,y0,x1,y1,c='w'){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
      const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
      for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}},
    fill(x,y,c){const t=this.get(x,y);if(t===c)return;const st=[[x,y]];while(st.length){const [px,py]=st.pop();if(px<0||py<0||px>=w||py>=h||this.get(px,py)!==t)continue;a[py][px]=c;st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);}},
    disc(cx,cy,r,c='w'){for(let y=0;y<h;y++)for(let x=0;x<w;x++)if((x+.5-cx)**2+(y+.5-cy)**2<=r*r)this.set(x,y,c);},
    outline(c='k'){const b=a.map(r=>r.slice());for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(b[y][x]==='.')continue;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=h||xx>=w||b[yy][xx]==='.'){a[y][x]=c;break;}}}},
    stamp(rows,x0,y0){rows.forEach((r,y)=>r.split('').forEach((c,x)=>{if(c!=='.')this.set(x0+x,y0+y,c);}));},
    rows(){return a.map(r=>r.join(''));}};
}

/* ---------------- pixel fonts ----------------

   '*' is drawn as a multiply sign (lives "x 3"). */

I:'01111110001100000110000011000001100000110001111110000000',J:'00000110000011000001100000110000011110001101111100000000',

S:'01111101100011110000001111100000011110001101111100000000',T:'01111110001100000110000011000001100000110000011000000000',
U:'11000111100011110001111000111100011110001101111100000000',V:'11000111100011110001111101110111110001110000010000000000',
W:'11010111101011110101111010111111111111011101000100000000',X:'11000111100011011011000111000110110110001111000110000000',
Y:'01100110110011011001100111100001100000110000011000000000',Z:'11111110000111000111000111000111000111000011111110000000',
"/":'00000010000010000010000010000010000010000010000000000000',"+":'00000000001100000110001111110001100000110000000000000000',
".":'00000000000000000000000000000000000001100000110000000000',"!":'00111000011100001110000110000011000000000000110000000000',
"?":'01111101111111110001100001100011100000000000111000000000',"-":'00000000000000000000001111110000000000000000000000000000',
":":'00000000011000001100000000000011000001100000000000000000',"*":'00000000100010001010000010000010100010001000000000000000',
"'":'00110000011000001100000000000000000000000000000000000000',"&":'01110001101100110110001110001101101110011001111110000000',
">":'01100000011000000110000001100001100001100001100000000000',"<":'00001100001100001100001100000011000000110000001100000000',
",":'00000000000000000000000000000000000001100000110000110000',"_":'00000000000000000000000000000000000000000000000001111111',
"#":'01101101111111011011001101100110110111111101101100000000',"(":'00001100001100001100000110000011000000110000001100000000',
")":'01100000011000000110000011000001100001100001100000000000',"=":'00000000000000111111100000001111111000000000000000000000'
};
const FONT_T={
'0':'011001001010010100100110000000','1':'110000100001000010001110000000','2':'111000001001100100001111000000','3':'111000001001100000101110000000',
'4':'101001010011110001000010000000','5':'111101000011100000101110000000','6':'011001000011100100100110000000','7':'111100001000100010000100000000',
'8':'011001001001100100100110000000','9':'011001001001110000100110000000',A:'011001001011110100101001000000',B:'111001001011110100101110000000',
C:'011001001010000100100110000000',D:'111001001010010100101110000000',E:'111001000011100100001110000000',F:'111001000011100100001000000000',
G:'011101000010110100100110000000',H:'100101001011110100101001000000',I:'100001000010000100001000000000',J:'000100001000010100100110000000',
K:'100101010011000101001001000000',L:'100001000010000100001110000000',M:'100011101110101100011000100000',N:'100011100110101100111000100000',

W:'100011010110101101010101000000',X:'100010101000100010101000100000',Y:'100010101000100001000010000000',Z:'111000010001000100001110000000',
"/":'001000010001000100001000000000',"+":'001000010011111001000010000000',".":'000000000000000000001000000000',"!":'100001000010000000001000000000',
"?":'111000001001100000000100000000',"-":'000000000011100000000000000000',":":'000001000000000100000000000000',"*":'000001010001000101000000000000',

",":'000000000000000000000100010000',"_":'000000000000000000000000011110',"#":'010101111101010111110101000000',"(":'010001000010000100000100000000',
")":'100000100001000010001000000000',"=":'000001110000000111000000000000'
};
const glyphCache={};
function glyph(ch,ink,thin){
  const key=ch+ink+(thin?'t':''); if(glyphCache[key]!==undefined) return glyphCache[key];
  const b=(thin?FONT_T:FONT)[ch]; if(!b){glyphCache[key]=null;return null;}
  const gw=thin?5:7, gh=thin?6:8, hex=ink[0]==='#', L=hex?'c':ink;
  const rows=[];for(let y=0;y<gh;y++){let r='';for(let x=0;x<gw;x++)r+=b[y*gw+x]==='1'?L:'.';rows.push(r);}
  return glyphCache[key]=bitmap(rows,gw,gh,hex?Object.assign({},GRAY,{c:ink}):GRAY);

/* thin text is proportional: each glyph is as wide as its ink, plus 1px; a space is 3px */
const thinAdv=ch=>{ const b=FONT_T[ch]; if(!b) return 3; let w=0; for(let i=0;i<b.length;i++) if(b[i]==='1') w=Math.max(w,i%5+1); return w+1; };

function text(s,x,y,o={}){
  s=String(s).toUpperCase(); const sc=o.scale||1, adv=(o.thin?6:8)*sc, w=textW(s,o);
  if(o.align==='c')x=Math.round(x-w/2); else if(o.align==='r')x=x-w;
  const gw=o.thin?5:7, gh=o.thin?6:8, dy=o.thin?sc:0;
  const draw=(ink,ox,oy)=>{ let cx=x; for(let i=0;i<s.length;i++){ const g=glyph(s[i],ink,o.thin);
    if(g) ctx.drawImage(g,cx+ox,y+oy+dy,gw*sc,gh*sc); cx+=o.thin?thinAdv(s[i])*sc:adv; } };
  if(o.shadow) draw('k',sc,sc);
  draw(o.ink||'w',0,0);
}

/* ---------------- the Partner ----------------

const HEAD_S=[

const BODY_S={

function carbonFrame(k){
  const g=grid(16,16), cx=8, cy=9;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const dx=x+.5-cx, dy=y+.5-cy, d=Math.hypot(dx,dy); const a=Math.atan2(dy,dx)+k*Math.PI/8;
    const sp=Math.PI/4, m=Math.abs(((a%sp)+sp)%sp-sp/2);
    if(d<=5.2 || (d<=7.8 && m<(7.8-d)*0.17)) g.set(x,y,(d<4.6&&dx<-0.5&&dy<-0.5&&d>2)?'d':'k');
  }
  g.rect(5,8,2,2,'w'); g.rect(10,8,2,2,'w'); g.set(6,9,'k'); g.set(10,9,'k');
  g.set(4,6,'l'); g.set(5,7,'l'); g.set(12,6,'l'); g.set(11,7,'l'); g.line(6,12,10,12,'l');
  return mk(g.rows());
}

function puffRow(n,kind){

/* ---------------- 8-bit MOC logo ----------------

const LOGO_D=[...document.querySelectorAll('#logo-src g path')].map(p=>p.getAttribute('d'));
// Hand touch-ups after rasterizing: [x, y, '#' ink or 'x' field]. 64 px: stray pixels at the end of the C's upper arm.
const LOGO_TOUCHUP={64:[[56,12,'#'],[57,11,'#']]};
function pixelLogo(w){
  const vbW=292.54, vbH=298.86, h=Math.round(w*vbH/vbW), ss=8;
  const c=document.createElement('canvas'); c.width=w*ss; c.height=h*ss; const g=c.getContext('2d');
  g.scale(w*ss/vbW,h*ss/vbH); g.fillStyle='#fff'; for(const d of LOGO_D) g.fill(new Path2D(d));
  const id=g.getImageData(0,0,w*ss,h*ss).data, rows=[];
  for(let y=0;y<h;y++){ let r=''; for(let x=0;x<w;x++){ let s=0;
    for(let j=0;j<ss;j++)for(let i=0;i<ss;i++) s+=id[(((y*ss+j)*w*ss)+(x*ss+i))*4+3];
    r+= s/(ss*ss*255)>=0.5?'#':'x'; } rows.push(r); }
  for(const [x,y,c] of (LOGO_TOUCHUP[w]||[])) rows[y]=rows[y].slice(0,x)+c+rows[y].slice(x+1);
  return mk(rows);
}

  g.rect(1,4,W-2,1,'d'); g.rect(6,1,4,3,'t'); g.rect(6,4,4,1,'d');
  BOX_MARK.forEach((r,y)=>r.split('').forEach((c,x)=>{ if(c==='#') g.set(1+x,7+y,'i'); }));
  g.rect(0,0,W,1,'o'); g.rect(0,H-1,W,1,'o'); g.rect(0,0,1,H,'o'); g.rect(W-1,0,1,H,'o');   // dark-brown edge so the black MOC stays separate from it

/* ---------------- collision ---------------- */
function collideX(e){
  const y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-0.01)/TS);
  if(e.vx>0){ const tx=Math.floor((e.x+e.w-0.01)/TS); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ e.x=tx*TS-e.w; return 1; } }
  else if(e.vx<0){ const tx=Math.floor(e.x/TS); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ e.x=(tx+1)*TS; return -1; } }
  return 0;
}
function collideY(e,isPlayer){
  const x0=Math.floor(e.x/TS), x1=Math.floor((e.x+e.w-0.01)/TS); const r={ground:false,head:null};
  if(e.vy>=0){ const ty=Math.floor((e.y+e.h)/TS);
    for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty) && e.y+e.h-e.vy<=ty*TS+0.5+Math.max(0,e.vy)){ e.y=ty*TS-e.h; e.vy=0; r.ground=true; break; } }
  else { const ty=Math.floor(e.y/TS); let best=null, bd=99;
    for(let tx=x0;tx<=x1;tx++){ const c=(ty>=0&&ty<LH)?map[ty][tx]:' '; if(solidAt(tx,ty)||(isPlayer&&c==='L')){ const d=Math.abs(tx*TS+8-(e.x+e.w/2)); if(d<bd){bd=d;best=[tx,ty];} } }
    if(best){ e.y=(best[1]+1)*TS; e.vy=0; r.head=best; } }
  return r;
}
const overlap=(a,b,s=0)=>a.x+s<b.x+b.w && a.x+a.w-s>b.x && a.y+s<b.y+b.h && a.y+a.h-s>b.y;

/* ---------------- blocks ---------------- */
function hitBlock(tx,ty){
  const c=map[ty][tx], key=tx+','+ty; const bx=tx*16, by=ty*16;
  const spawnItem=(kind)=>{ items.push(makeItem(kind,bx,by)); SFX.appear(); };
  if(c==='?'){ map[ty][tx]='U'; popDrop(bx,by); bump(tx,ty); }
  else if(c==='M'){ map[ty][tx]='U'; spawnItem(P.big?'aerosol':'bottle'); bump(tx,ty); }
  else if(c==='S'){ map[ty][tx]='U'; spawnItem('octane'); bump(tx,ty); }
  else if(c==='L'){ map[ty][tx]='U'; spawnItem('jug'); bump(tx,ty); }
  else if(c==='C'){ const d=blockData[key]||{n:8}; blockData[key]=d; d.n--; popDrop(bx,by); bump(tx,ty); if(d.n<=0) map[ty][tx]='U'; }
  else if(c==='B'){
    if(P.big){ map[ty][tx]=' '; SFX.brick(); addScore(50);
      for(const [vx,vy,ox,oy] of [[-1.2,-5,0,0],[1.2,-5,8,0],[-1,-3.5,0,8],[1,-3.5,8,8]]) parts.push({k:'debris',x:bx+ox,y:by+oy,vx,vy,t:90});
      bumpKill(tx,ty);
    } else bump(tx,ty);
  } else SFX.bump();
}
function bump(tx,ty){ bumps.push({tx,ty,t:10}); SFX.bump(); bumpKill(tx,ty); }
function bumpKill(tx,ty){
  const top=ty*16, l=tx*16, r=l+16;
  for(const e of enemies) if(!e.dead && e.x+e.w>l && e.x<r && Math.abs(e.y+e.h-top)<4){ killFlip(e,100); }
  for(const it of items) if(it.out && it.x+it.w>l && it.x<r && Math.abs(it.y+it.h-top)<4){ it.vy=-3.5; it.vx=(it.x+it.w/2<l+8)?-1:1; }
}
function popDrop(bx,by){ parts.push({k:'drop',x:bx+3,y:by-14,vy:-5,t:30}); addDrop(); }
function makeItem(kind,bx,by){
  const dims={bottle:[12,24],aerosol:[16,27],octane:[10,16],jug:[16,16]}[kind];
  return {kind,x:bx+(16-dims[0])/2,y:by,w:dims[0],h:dims[1],vx:0,vy:0,rise:dims[1],out:false,t:0};
}

/* ---------------- enemies ---------------- */
function spawnEnemies(){
  while(spawnIdx<spawns.length && spawns[spawnIdx].x*16 < cam.x+W+24){
    const s=spawns[spawnIdx++]; const x=s.x*16;
    if(s.t==='sludge') enemies.push({t:'sludge',x:x+1,y:(13-(s.h||1))*16+2,w:14,h:14,vx:-0.5,vy:0,dead:false,anim:0});
    if(s.t==='carbon') enemies.push({t:'carbon',x:x+2,y:(13-(s.h||1))*16+4,w:12,h:12,vx:-0.35,vy:0,dead:false,anim:0});
    if(s.t==='invoice') enemies.push({t:'invoice',x:x+2,y:(13-s.h)*16,by:(13-s.h)*16,w:12,h:15,vx:-0.55,vy:0,dead:false,anim:0,ph:s.x});
  }
}
function killFlip(e,pts){ if(e.dead) return; e.dead='flip'; e.vy=-4; e.vx=e.vx>=0?0.6:-0.6; SFX.kick(); addScore(pts,e.x,e.y); if(e.t==='invoice') cuts++; }
function updateEnemies(){
  for(const e of enemies){
    e.anim++;
    if(e.dead==='flip'){ e.vy+=0.3; e.x+=e.vx; e.y+=e.vy; continue; }
    if(e.dead==='flat'){ e.ft--; continue; }
    if(e.t==='invoice'){ e.x+=e.vx; e.y=e.by+Math.sin((e.anim+e.ph*20)*0.045)*18; continue; }
    e.vy=Math.min(e.vy+0.4,5); e.x+=e.vx; if(collideX(e)) e.vx=-e.vx;
    e.y+=e.vy; const r=collideY(e,false);
    if(e.t==='carbon' && r.ground){ const fx=Math.floor((e.vx>0?e.x+e.w+1:e.x-1)/16), fy=Math.floor((e.y+e.h+1)/16); if(!solidAt(fx,fy)) e.vx=-e.vx; }
  }
  for(let i=0;i<enemies.length;i++) for(let j=i+1;j<enemies.length;j++){ const a=enemies[i], b=enemies[j];
    if(a.dead||b.dead||a.t==='invoice'||b.t==='invoice') continue;
    if(overlap(a,b)){ if((a.x<b.x&&a.vx>0)||(a.x>b.x&&a.vx<0)) a.vx=-a.vx; if((b.x<a.x&&b.vx>0)||(b.x>a.x&&b.vx<0)) b.vx=-b.vx; } }
  enemies=enemies.filter(e=>e.y<H+32 && e.x>cam.x-80 && !(e.dead==='flat'&&e.ft<=0));
}

/* ---------------- player ---------------- */
function hurt(){
  if(P.inv>0||P.star>0) return;
  if(P.big){ P.big=false; P.power=0; P.y+=P.h-15; P.h=15; P.crouch=false; P.inv=120; freeze=36; P.grow=-36; SFX.shrink(); }
  else die();
}
let timeUpDeath=false;
function die(){ if(state!=='play') return; timeUpDeath=timeLeft<=0; P.dead=true; P.vy=-5; P.vx=0; setState('dying'); SFX.die(); }
function grow(){ P.big=true; P.y-=30-P.h; P.h=30; freeze=40; P.grow=40; SFX.power(); }
/* Movement follows the original NES feel: per-frame values in pixels.
   Walk tops out at 1.5625, run at 2.5625; skidding brakes harder than letting go;
   jump strength and gravity depend on horizontal speed at take-off; holding A lowers gravity on the way up. */
const PH={walkMax:1.5625,runMax:2.5625,walkAcc:0.0371,runAcc:0.0557,release:0.0508,skid:0.1016,minWalk:0.0742,maxFall:4.5};
const JUMPS=[[1.0,-4,0.125,0.4375],[2.3125,-4,0.1172,0.375],[99,-5,0.1563,0.5625]];
function updatePlayer(){
  const p=P;
  if(p.auto) return updateAuto();
  const L=IN.left, R=IN.right, run=IN.b, down=IN.down;
  const jHeld=IN.a||IN.kup, jPress=pressed('a')||pressed('kup');
  const dir=(R&&!L)?1:(L&&!R)?-1:0;
  const sp=Math.abs(p.vx), sgn=Math.sign(p.vx);
  p.skid=false;
  if(p.onG){
    p.crouch = p.big && down;
    const d = p.crouch?0:dir;
    if(d!==0){
      if(sgn!==0 && sgn!==d){ p.vx+=d*PH.skid; p.skid=sp>0.5; if(Math.sign(p.vx)===d) p.vx=d*PH.minWalk; p.face=d; }
      else {
        const max=(run?PH.runMax:PH.walkMax)*(p.star>0?1.12:1), acc=run?PH.runAcc:PH.walkAcc;
        if(sp<PH.minWalk) p.vx=d*PH.minWalk;
        const before=Math.abs(p.vx); p.vx+=d*acc;
        if(Math.abs(p.vx)>max) p.vx=d*(before>max?Math.max(max,before-PH.release):max);
        p.face=d;
      }
    } else if(sp>0){ const n=sp-PH.release; p.vx = n<=0?0:sgn*n; }
  } else if(dir!==0){
    const acc = sp>=PH.walkMax?PH.runAcc:PH.walkAcc;
    p.vx+=dir*acc;
    if(Math.abs(p.vx)>p.airMax) p.vx=Math.sign(p.vx)*p.airMax;
  }
  if(p.power===1 && pressed('b') && shots.length<2 && !p.crouch){
    shots.push({x:p.x+(p.face>0?p.w:-8),y:p.y+(p.big?10:4),vx:p.face*4,vy:1.5,t:120}); SFX.spray(); p.throwT=8;
  }
  if(jPress) p.jbuf=6; else if(p.jbuf>0) p.jbuf--;
  if(p.onG) p.coy=4; else if(p.coy>0) p.coy--;
  if(p.jbuf>0&&p.coy>0){
    const row=JUMPS.find(j=>Math.abs(p.vx)<j[0]);
    p.vy=row[1]; p.gU=row[2]; p.gD=row[3]; p.jumping=true;
    p.airMax=Math.max(PH.walkMax,Math.abs(p.vx)>PH.walkMax||run?PH.runMax:PH.walkMax);
    p.onG=false; p.coy=0; p.jbuf=0; p.lift=null; SFX.jump(p.big);
  }
  if(!p.onG && !p.jumping && p.gD===undefined){ p.gU=0.125; p.gD=0.4375; }
  const g=(p.vy<0&&jHeld&&p.jumping)?p.gU:p.gD; p.vy=Math.min(p.vy+g,PH.maxFall);
  if(p.lift) p.y+=p.lift.dy;
  p.x+=p.vx; if(collideX(p)) p.vx=0;
  if(p.x<cam.x){ p.x=cam.x; if(p.vx<0) p.vx=0; }
  const prevB=p.y+p.h; p.y+=p.vy; const r=collideY(p,true);
  const wasG=p.onG; p.onG=r.ground; p.lift=null;
  if(!p.onG && p.vy>=0) for(const l of lifts){ if(p.x+p.w>l.x+1 && p.x<l.x+l.w-1 && prevB<=l.y+3+Math.abs(l.dy) && p.y+p.h>=l.y){ p.y=l.y-p.h; p.vy=0; p.onG=true; p.lift=l; } }
  if(p.onG){ p.jumping=false; p.gU=0.125; p.gD=0.4375; p.airMax=PH.runMax; }
  else if(wasG && !p.jumping){ p.airMax=Math.max(PH.walkMax,Math.abs(p.vx)); }
  if(r.head) hitBlock(r.head[0],r.head[1]);
  if(p.onG) p.chain=0;
  p.prevB=prevB;
  // walk cycle: a new frame every 5 game frames when slow, 3 at walking speed, 2 when running
  if(p.onG && Math.abs(p.vx)>0.01 && p.wasStill){ p.anim=2; p.animT=0; }
  p.wasStill = !(Math.abs(p.vx)>0.01) || !p.onG;
  if(p.onG && Math.abs(p.vx)>0.01){ const delay=Math.abs(p.vx)<1?5:Math.abs(p.vx)<2?3:2; if(++p.animT>=delay){ p.animT=0; p.anim=(p.anim+1)%3; } }
  if(p.throwT>0) p.throwT--;
  if(p.inv>0) p.inv--;
  if(p.star>0){ p.star--; if(p.star===0) MUS.tempo=hurried?1.25:1; }
  for(const d of fieldDrops) if(!d.got && overlap(p,d)){ d.got=true; addDrop(); }
  const poleX=POLE_COL*16-1;   // the base block counts, so walking into it finishes the level
  if(!flag.done && p.x+p.w>=poleX){ startFlag(); }
  if(p.y>H+8) die();
}
function startFlag(){
  const p=P; flag.done=true; p.auto='slide'; p.autoT=0; p.vx=0; p.vy=0; p.x=POLE_COL*16+7-p.w+1;
  const gy=p.y; flagPts= gy<56?5000: gy<88?2000: gy<120?800: gy<160?400:100; addScore(flagPts,p.x+14,p.y);
  flag.y=40; musicStop(); SFX.flag(); P.star=0;
  const dg=timeLeft%10; fireworksLeft=(dg===1||dg===3||dg===6)?dg:0;
}
function updateAuto(){
  const p=P; p.autoT++;
  if(p.auto==='slide'){
    const bottom=flag.base-p.h; if(p.y<bottom) p.y=Math.min(bottom,p.y+2.2);
    flag.y=Math.min(flag.base-28,flag.y+2.2);
    if(p.y>=bottom && flag.y>=flag.base-28 && p.autoT>40){ p.auto='hop'; p.autoT=0; p.x+=13; p.face=-1; }
  } else if(p.auto==='hop'){ if(p.autoT>16){ p.auto='walk'; p.face=1; SFX.fanfare(); } }
  else if(p.auto==='walk'){
    p.vx=1.25; p.vy=Math.min(p.vy+0.62,5.5); p.x+=p.vx; collideX(p); p.y+=p.vy; const r=collideY(p,false); p.onG=r.ground; if(++p.animT>=3){p.animT=0;p.anim=(p.anim+1)%3;}
    if(p.x+p.w/2>=BAY_COL*16+40){ p.hidden=true; p.auto='in'; p.autoT=0; }
  } else if(p.auto==='in'){ if(p.autoT>30){ timeBonus=0; setState('tally'); } }
}

/* ---------------- items, shots, particles ---------------- */
function collect(it){
  it.gone=true;
  if(it.kind==='bottle'){ addScore(1000,it.x,it.y); showBanner('MOTOR OIL CONDITIONER','PROTECTION UP'); if(!P.big) grow(); else SFX.power(); }
  if(it.kind==='aerosol'){ addScore(1000,it.x,it.y); showBanner('BRAKE WASH','B TO SPRAY // CLEANS SLUDGE'); if(!P.big) grow(); else { P.power=1; freeze=30; P.grow=30; SFX.power(); } }
  if(it.kind==='octane'){ addScore(1000,it.x,it.y); showBanner('THRUST OCTANE BOOSTER','FULL THROTTLE'); P.star=600; MUS.tempo=1.45; SFX.power(); }
  if(it.kind==='jug'){ lives++; pops.push({x:it.x,y:it.y,txt:'1UP',t:50}); showBanner('PREMIUM ENGINE TREATMENT','EXTRA LIFE'); SFX.oneup(); }
}
function updateItems(){
  for(const it of items){
    it.t++;
    if(!it.out){ it.y-=0.5; it.rise-=0.5; if(it.rise<=0){ it.out=true; if(it.kind==='bottle'||it.kind==='jug') it.vx=1; if(it.kind==='octane'){ it.vx=1.3; it.vy=-3; } } continue; }
    if(it.kind!=='aerosol'){
      it.vy=Math.min(it.vy+0.3,5); it.x+=it.vx; if(collideX(it)) it.vx=-it.vx;
      it.y+=it.vy; const r=collideY(it,false); if(r.ground && it.kind==='octane') it.vy=-4.2;
    }
    if(overlap(P,it,1)) collect(it);
  }
  items=items.filter(it=>!it.gone && it.y<H+20 && it.x>cam.x-40);
}
function updateShots(){
  for(const s of shots){
    s.t--; s.vy=Math.min(s.vy+0.35,4); s.x+=s.vx;
    if(solidAt(Math.floor((s.x+4)/16),Math.floor((s.y+4)/16))) s.t=0;
    s.y+=s.vy;
    if(s.vy>0 && solidAt(Math.floor((s.x+4)/16),Math.floor((s.y+8)/16))){ s.y=Math.floor((s.y+8)/16)*16-8; s.vy=-3.2; }
    if(s.y>H) s.t=0;
    for(const e of enemies) if(!e.dead && overlap({x:s.x,y:s.y,w:8,h:8},e)){ killFlip(e,e.t==='invoice'?500:200); s.t=0; break; }
    if(s.t<=0 && s.y<H) parts.push({k:'puff',x:s.x,y:s.y,t:12});
  }
  shots=shots.filter(s=>s.t>0 && s.x>cam.x-16 && s.x<cam.x+W+16);
}
function updateParts(){
  for(const q of parts){ q.t--; if(q.k==='debris'){ q.vy+=0.3; q.x+=q.vx; q.y+=q.vy; } if(q.k==='drop'){ q.vy+=0.32; q.y+=q.vy; if(q.t===0) pops.push({x:q.x-2,y:q.y,txt:'200',t:30}); }
    if(q.k==='firework'){ q.f++; } }
  parts=parts.filter(q=>q.t>0);
  for(const q of pops){ q.t--; q.y-=0.6; } pops=pops.filter(q=>q.t>0);
  for(const b of bumps) b.t--; bumps=bumps.filter(b=>b.t>0);
  if(banner&&--banner.t<=0) banner=null;
}
function playerVsEnemies(){
  if(P.dead||P.auto) return;
  for(const e of enemies){
    if(e.dead||!overlap(P,e,2)) continue;
    if(P.star>0){ killFlip(e,e.t==='invoice'?500:200); continue; }
    const stompable=e.t!=='carbon';
    if(stompable && P.vy>0 && P.prevB<=e.y+6){
      P.chain++; const tbl=[100,200,400,500,800,1000,2000,4000,5000,8000];
      let pts=tbl[Math.min(P.chain-1,tbl.length-1)]; if(e.t==='invoice'){ pts=Math.max(pts,500); cuts++; }
      addScore(pts,e.x,e.y);
      if(e.t==='sludge'){ e.dead='flat'; e.ft=30; } else { e.dead='flip'; e.vy=0; e.vx=0; }
      P.vy=-4; P.jumping=true; P.gU=0.125; P.gD=0.4375; P.y=e.y-P.h; SFX.stomp();
    } else hurt();
  }
}
function updateLifts(){ for(const l of lifts){ const ny=l.y+l.dir*l.sp; if(ny<=l.top){l.dir=1;} if(ny>=l.bot){l.dir=-1;} l.dy=Math.max(l.top,Math.min(l.bot,ny))-l.y; l.y+=l.dy; } }
function updateCamera(){ const target=P.x-104; if(target>cam.x) cam.x=Math.min(target,LW*16-W); }

function updatePlay(){
  if(freeze>0){ freeze--; if(P.grow>0)P.grow--; else if(P.grow<0)P.grow++; updateParts(); return; }
  if(!P.auto){
    timeAcc++; if(timeAcc>=24){ timeAcc=0; timeLeft--; if(timeLeft===100&&!hurried){ hurried=true; SFX.hurry(); MUS.tempo=P.star>0?1.45:1.25; } if(timeLeft<=0){ timeLeft=0; die(); return; } }
  }
  updateLifts(); updatePlayer(); if(state!=='play') return;
  spawnEnemies(); updateEnemies(); playerVsEnemies(); updateItems(); updateShots(); updateParts(); updateCamera();
  if(!checkpoint && P.x>CHECK_COL*16) checkpoint=true;
  if(frame-lastInput>60*60 && !P.auto){ toTitle(); }
}

function spr(s,x,y,flip,mode){ ctx.drawImage(img(s,flip,mode),sx(x),Math.round(y)); }

function px(x,y,w=1,h=1){ ctx.fillRect(x,y,w,h); }
function rectO(x,y,w,h){ px(x,y,w,1); px(x,y+h-1,w,1); px(x,y,1,h); px(x+w-1,y,1,h); }

function drawTiles(){

function playerSprite(big){
  const p=P;
  if(big&&p.crouch) return PB.crouch;
  let k='stand';
  if(p.auto==='slide'||p.auto==='hop'||!p.onG) k='jump';
  else if(p.skid) k='skid';
  else if(Math.abs(p.vx)>0.01||p.auto==='walk') k=['w1','w2','w3'][p.anim%3];
  return (big?PB:PS)[k];
}
function drawPlayer(){
  const p=P; if(p.hidden) return;
  if(p.dead){ sprS(P_DIE, sx(p.x-2), p.y-1); return; }
  if(p.inv>0 && Math.floor(frame/2)%2===0 && freeze===0) return;
  let big=p.big; if(p.grow>0) big=Math.floor(p.grow/4)%2===0; if(p.grow<0) big=Math.floor(-p.grow/4)%2===1;
  const s=playerSprite(big);
  const mode = p.star>0 ? (Math.floor(frame/3)%3===0?'i':(p.power?'p':'n')) : (p.power?'p':'n');
  spr(s,p.x-2,p.y+p.h-s.h,p.face<0,mode);
}
function drawEnemies(){
  for(const e of enemies){
    const fr=Math.floor(e.anim/10)%2;
    if(e.t==='sludge'){ if(e.dead==='flat') spr(SLUDGE_FLAT,e.x-1,e.y-2); else drawMaybeFlipped(SLUDGE[fr],e.x-1,e.y-1,e.dead==='flip',fr===1); }
    if(e.t==='carbon') drawMaybeFlipped(CARBON[Math.floor(e.anim/8)%2],e.x-2,e.y-4,e.dead==='flip');
    if(e.t==='invoice') drawMaybeFlipped(INVOICE[e.dead?0:Math.floor(e.anim/8)%2],e.x-2,e.y,e.dead==='flip');
  }
}
function drawMaybeFlipped(s,x,y,upside,mirror){
  if(!upside){ spr(s,x,y,!!mirror); return; }
  ctx.save(); ctx.translate(sx(x),Math.round(y)+s.h); ctx.scale(1,-1); ctx.drawImage(s.n,0,0); ctx.restore();
}
function drawItem(it){
  const s={bottle:BOTTLE,aerosol:AEROSOL,octane:OCTANE,jug:JUG}[it.kind];
  const mode=it.kind==='octane'&&Math.floor(frame/4)%2===0?'i':'n';
  if(!it.out){ const by=Math.floor((it.y+it.h+it.rise)/16)*16; ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,by); ctx.clip(); spr(s,it.x,it.y,false,mode); ctx.restore(); return; }
  spr(s,it.x,it.y,false,mode);
}
function drawItemsBehind(){ for(const it of items) if(!it.out) drawItem(it); }
function drawItemsFront(){ for(const it of items) if(it.out) drawItem(it); }
function drawFieldDrops(){ const f=[0,0,0,1,2,3][Math.floor(frame/8)%6]; for(const d of fieldDrops) if(!d.got){ const x=sx(d.x); if(x>-12&&x<W) spr(DROP[f],d.x,d.y); } }

function bigWordW(word,sx,gap){ let w=0; for(const ch of word){ w+= ch===' '?4*sx:BIGF[ch][0].length*sx+gap; } return w-gap; }
function bigWord(word,x,y,sx,sy,gap,dx,dy){
  for(const pass of [0,1]){ let cx=x;
    for(const ch of word){ if(ch===' '){ cx+=4*sx; continue; } const g=BIGF[ch], gw=g[0].length;
      for(let r=0;r<g.length;r++) for(let c=0;c<gw;c++){ const v=g[r][c]; if(v==='.') continue;
        if(pass===0){ fill('k'); px(cx+c*sx+dx,y+r*sy+dy,sx,sy); } else { fill(v==='k'?'k':NES.peach); px(cx+c*sx,y+r*sy,sx,sy); } }
      cx+=gw*sx+gap; } }
}

  text('MAP 1 // SERVICE DRIVE',W/2,42,{align:'c'});
  hiscores.forEach(([n,s],i)=>{ const y=62+i*14; const hl=i===newRank&&Math.floor(stT/15)%2===0;
    if(hl){ fill('w'); px(40,y-3,176,13); }
    const ink=hl?'k':'w'; text(pad0(i+1,2),48,y,{ink}); text(n,96,y,{ink}); text(pad0(s,6),208,y,{align:'r',ink}); });
  if(Math.floor(stT/30)%2===0) text(touchMode?'TAP START':'PRESS START',W/2,212,{align:'c'});
}
function drawIntro(){
  fill('k'); ctx.fillRect(0,0,W,H); drawHUD();
  text('MAP 1',W/2,38,{align:'c',scale:2}); text('SERVICE DRIVE',W/2,60,{align:'c'});
  ctx.drawImage(PS.stand.n,100,76); text('*  '+lives,124,81);
  ctx.drawImage(BOTTLE_BIG.n,W/2-22,100,44,86);   // exact 2x
  text('USE MOC PRODUCTS.',W/2,198,{align:'c'}); text('REDUCE VENDORS.',W/2,210,{align:'c'});
}
let fireworksLeft=0;
function tickTally(){
  if(flag.bay<16) flag.bay++;
  if(timeLeft>0){ const n=Math.min(timeLeft,2); timeLeft-=n; score+=50*n; timeBonus+=50*n; if(frame%4===0) SFX.tick(); stT=1; }
  else if(stT>40) setState(fireworksLeft>0?'fireworks':'clear');
  updateParts();
}
const FW_SPOTS=[[24,60],[76,48],[48,76],[90,66],[14,46],[62,40]];
function tickFireworks(){
  if(stT%36===1 && fireworksLeft>0){ const [ox,oy]=FW_SPOTS[(6-fireworksLeft)%6]; parts.push({k:'firework',x:BAY_COL*16+ox,y:oy,f:0,t:30}); fireworksLeft--; addScore(500); SFX.firework(); }
  updateParts();
  if(fireworksLeft===0 && !parts.some(q=>q.k==='firework') && stT>40) setState('clear');
}
function drawClear(){
  fill('k'); ctx.fillRect(0,0,W,H);
  text('MAP 1 CLEAR',W/2,6,{align:'c',scale:2});
  ctx.drawImage(LOGO_BIG.n,96,28);
  text('ONE PARTNER. ONE INVOICE.',W/2,104,{align:'c'}); text('ONE SOLUTION.',W/2,114,{align:'c'});
  const rows=[['DROPS',pad0(drops,2)],['INVOICES',pad0(cuts,2)],['FLAG',pad0(flagPts,4)],['TIME BONUS',pad0(timeBonus,5)],['SCORE',pad0(score,6)]];
  rows.forEach(([k,v],i)=>{ const y=130+i*11; text(k,32,y); text(v,224,y,{align:'r'}); });
  text('THANKS FOR PLAYING',W/2,192,{align:'c'});
  if(stT>90 && Math.floor(stT/30)%2===0) text(touchMode?'TAP START':'PRESS START',W/2,210,{align:'c'});
}
function drawOver(){
  fill('k'); ctx.fillRect(0,0,W,H); drawHUD();
  text('GAME OVER',W/2,116,{align:'c'});
}
function afterRun(){ if(qualifies(score)){ entry={letters:[0,0,0],pos:0,t:0}; setState('entry'); } else { newRank=-1; setState('scores'); } }
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ.';
function drawEntry(){
  fill('k'); ctx.fillRect(0,0,W,H);
  text('NEW HIGH SCORE',W/2,36,{align:'c',scale:2}); text(pad0(score,6),W/2,64,{align:'c'});
  text('ENTER YOUR INITIALS',W/2,90,{align:'c'});
  for(let i=0;i<3;i++){ const x=W/2-40+i*28; const ch=ABC[entry.letters[i]];
    text(ch,x+3,114,{scale:2}); fill('w'); if(i===entry.pos && Math.floor(stT/12)%2===0) px(x+1,134,18,2); else if(i<entry.pos) px(x+1,134,18,1); }
  text('UP DOWN CHANGE   A NEXT   B BACK',W/2,168,{align:'c',thin:true});
}
function tickEntry(){
  const e=entry;
  if(pressed('up')||pressed('right')){ e.letters[e.pos]=(e.letters[e.pos]+1)%ABC.length; SFX.select(); }
  if(pressed('down')||pressed('left')){ e.letters[e.pos]=(e.letters[e.pos]+ABC.length-1)%ABC.length; SFX.select(); }
  if(pressed('b')&&e.pos>0){ e.pos--; SFX.select(); }
  if(pressed('a')||pressed('start')||frame-lastInput>45*60){ SFX.ping(); e.pos++; if(e.pos>2||frame-lastInput>45*60){
    const name=e.letters.map(i=>ABC[i]).join('');
    hiscores.push([name,score]); hiscores.sort((a,b)=>b[1]-a[1]); hiscores=hiscores.slice(0,10);
    newRank=hiscores.findIndex(h=>h[0]===name&&h[1]===score); saveHS(); setState('scores'); } }
}

/* ---------------- main loop ---------------- */
let paused=false;
function step(){
  frame++; stT++; pollInput();
  if(noticeT>0) noticeT--;
  switch(state){
    case 'title':
      titleRunner.x+=1.2; titleRunner.anim+=0.2; if(titleRunner.x>W+40) titleRunner.x=-60;
      if(stT>20&&(pressed('start')||pressed('a'))){ auInit(); SFX.ping(); if(menuSel===1){ menuSel=0; newRank=-1; setState('scores'); } else newGame(); }
      else if(stT>600){ menuSel=0; setState('scores'); }
      break;
    case 'scores':
      if(pressed('start')||pressed('a')){ auInit(); SFX.ping(); newRank=-1; newGame(); }
      else if(stT>(newRank>=0?720:420)){ newRank=-1; setState('title'); }
      break;
    case 'tally': tickTally(); break;
    case 'fireworks': tickFireworks(); break;
    case 'clear': if((stT>140&&(pressed('start')||pressed('a')))||stT>720) afterRun(); break;
    case 'over': if(stT>240) afterRun(); break;
    case 'entry': tickEntry(); break;
    case 'padcfg': if(stT>60*30) setState('title'); break;
    case 'intro': if(stT>150) startLevel(); break;
    case 'play':
      if(pressed('start')){ paused=!paused; SFX.ping(); if(paused) musicStop(); else musicStart(); }
      if(!paused) updatePlay();
      break;
    case 'dying':
      if(stT>28){ P.vy+=0.25; P.y+=P.vy; }
      updateParts();
      if(stT>170){ lives--; if(timeUpDeath){ timeUpDeath=false; setState('timeup'); } else if(lives>0) setState('intro'); else { setState('over'); SFX.over(); } }
      break;
    case 'timeup':
      if(stT>160){ if(lives>0) setState('intro'); else { setState('over'); SFX.over(); } }
      break;
  }
}
function render(){
  switch(state){
    case 'title': drawTitle(); break;
    case 'scores': drawScores(); break;
    case 'intro': drawIntro(); break;
    case 'play': case 'dying': drawWorld(); if(paused&&state==='play'){ panel(80,102,96,24,NES.blk,NES.wht); text('PAUSED',W/2,111,{align:'c'}); } break;
    case 'tally': drawWorld(); break;
    case 'clear': drawClear(); break;
    case 'over': drawOver(); break;
    case 'timeup': fill('k'); ctx.fillRect(0,0,W,H); drawHUD(); text('TIME UP',W/2,116,{align:'c'}); break;
    case 'fireworks': drawWorld(); break;
    case 'entry': drawEntry(); break;
    case 'padcfg': drawPadSetup(); break;
  }
  if(noticeT>0){ fill('k'); px(0,228,W,12); text(notice,W/2,230,{align:'c',thin:true}); }
}
let last=performance.now(), acc=0;
function loop(t){
  acc+=Math.min(100,t-last); last=t;
  while(acc>=1000/60){ step(); acc-=1000/60; }
  render(); requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'&&!paused){ paused=true; musicStop(); } });
buildLevel(); P=newPlayer(3); setState('title'); requestAnimationFrame(loop);
