<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leaderboard</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c" width="480" height="270" aria-label="Super MOC Bros. leaderboard"></canvas>
<script>
/* Super MOC Bros. leaderboard for the booth TVs.
   play.mocproducts.app/board            -> Booth board (NADA 2027)
   play.mocproducts.app/board?b=online   -> Online board
   Refreshes every 5 seconds; keeps the last board on screen if the connection drops.
   F or a click toggles full screen. Fonts: Press Start 2P and Silkscreen (SIL Open Font License 1.1). */
(()=>{
const FONT={
'0':'00111000100110110001111000111100011011001000111000000000','1':'00011000011100000110000011000001100000110001111110000000',
'2':'01111101100011000011100111100111100111000011111110000000','3':'01111110000110000110000111100000011110001101111100000000',
'4':'00011100011110011011011001101111111000011000001100000000','5':'11111101100000111111000000110000011110001101111100000000',
'6':'00111100110000110000011111101100011110001101111100000000','7':'11111111100011000011000011000011000001100000110000000000',
'8':'01111001100010111001001111001001111100001101111100000000','9':'01111101100011110001101111110000011000011001111000000000',
A:'00111000110110110001111000111111111110001111000110000000',B:'11111101100011110001111111101100011110001111111100000000',
C:'00111100110011110000011000001100000011001100111100000000',D:'11111001100110110001111000111100011110011011111000000000',
E:'11111111100000110000011111101100000110000011111110000000',F:'11111111100000110000011111101100000110000011000000000000',
G:'00111110110000110000011001111100011011001100111110000000',H:'11000111100011110001111111111100011110001111000110000000',
I:'01111110001100000110000011000001100000110001111110000000',J:'00000110000011000001100000110000011110001101111100000000',
K:'11000111100110110110011110001111100110111011001110000000',L:'01100000110000011000001100000110000011000001111110000000',
M:'11000111110111111111111010111101011110001111000110000000',N:'11000111110011111101111011111100111110001111000110000000',
O:'01111101100011110001111000111100011110001101111100000000',P:'11111101100011110001111000111111110110000011000000000000',
Q:'01111101100011110001111000111101111110011001111010000000',R:'11111101100011110001111001111111100110111011001110000000',
S:'01111101100011110000001111100000011110001101111100000000',T:'01111110001100000110000011000001100000110000011000000000',
U:'11000111100011110001111000111100011110001101111100000000',V:'11000111100011110001111101110111110001110000010000000000',
W:'11010111101011110101111010111111111111011101000100000000',X:'11000111100011011011000111000110110110001111000110000000',
Y:'01100110110011011001100111100001100000110000011000000000',Z:'11111110000111000111000111000111000111000011111110000000',
"/":'00000010000010000010000010000010000010000010000000000000',"+":'00000000001100000110001111110001100000110000000000000000',
".":'00000000000000000000000000000000000001100000110000000000',"!":'00111000011100001110000110000011000000000000110000000000',
"?":'01111101111111110001100001100011100000000000111000000000',"-":'00000000000000000000001111110000000000000000000000000000',
":":'00000000011000001100000000000011000001100000000000000000',"*":'00000000100010001010000010000010100010001000000000000000',
"'":'00110000011000001100000000000000000000000000000000000000',"&":'01110001101100110110001110001101101110011001111110000000',
">":'01100000011000000110000001100001100001100001100000000000',"<":'00001100001100001100001100000011000000110000001100000000',
",":'00000000000000000000000000000000000001100000110000110000',"_":'00000000000000000000000000000000000000000000000001111111',
"#":'01101101111111011011001101100110110111111101101100000000',"(":'00001100001100001100000110000011000000110000001100000000',
")":'01100000011000000110000011000001100001100001100000000000',"=":'00000000000000111111100000001111111000000000000000000000'
};
const FONT_T={
'0':'011001001010010100100110000000','1':'110000100001000010001110000000','2':'111000001001100100001111000000','3':'111000001001100000101110000000',
'4':'101001010011110001000010000000','5':'111101000011100000101110000000','6':'011001000011100100100110000000','7':'111100001000100010000100000000',
'8':'011001001001100100100110000000','9':'011001001001110000100110000000',A:'011001001011110100101001000000',B:'111001001011110100101110000000',
C:'011001001010000100100110000000',D:'111001001010010100101110000000',E:'111001000011100100001110000000',F:'111001000011100100001000000000',
G:'011101000010110100100110000000',H:'100101001011110100101001000000',I:'100001000010000100001000000000',J:'000100001000010100100110000000',
K:'100101010011000101001001000000',L:'100001000010000100001110000000',M:'100011101110101100011000100000',N:'100011100110101100111000100000',
O:'011001001010010100100110000000',P:'111001001011100100001000000000',Q:'011001001010010100100110000010',R:'111001001011100101001001000000',
S:'011101000001100000101110000000',T:'111000100001000010000100000000',U:'100101001010010100100110000000',V:'100011000101010010100010000000',
W:'100011010110101101010101000000',X:'100010101000100010101000100000',Y:'100010101000100001000010000000',Z:'111000010001000100001110000000',
"/":'001000010001000100001000000000',"+":'001000010011111001000010000000',".":'000000000000000000001000000000',"!":'100001000010000000001000000000',
"?":'111000001001100000000100000000',"-":'000000000011100000000000000000',":":'000001000000000100000000000000',"*":'000001010001000101000000000000',
"'":'100001000000000000000000000000',"&":'011101000001100100000111000100',">":'100000100000100010001000000000',"<":'001000100010000010000010000000',
",":'000000000000000000000100010000',"_":'000000000000000000000000011110',"#":'010101111101010111110101000000',"(":'010001000010000100000100000000',
")":'100000100001000010001000000000',"=":'000001110000000111000000000000'
};

const W=480, H=270, cv=document.getElementById('c'), ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const params=new URLSearchParams(location.search);
const BOARD=params.get('b')==='online'?'online':'booth';
const SUB=BOARD==='online'?'ONLINE':'NADA 2027 // MOC BOOTH';
const COL={w:'#FCFCFC',k:'#000000',gold:'#FCBC00',gray:'#787878',brick:'#C84C0C',peach:'#FCBCB0',dark:'#7C0800'};
let data={score:[],time:[]}, ok=false, lastOk=0, fails=0, t=0;

/* text drawing from the bit fonts (main: 7x8 on an 8 px advance; thin: 5x6, proportional) */
const cache={};
function glyph(ch,ink,thin){ const key=ch+ink+(thin?'t':''); if(key in cache) return cache[key];
  const b=(thin?FONT_T:FONT)[ch]; if(!b) return cache[key]=null; const gw=thin?5:7, gh=thin?6:8;
  const c=document.createElement('canvas'); c.width=gw; c.height=gh; const g=c.getContext('2d'); g.fillStyle=ink;
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++) if(b[y*gw+x]==='1') g.fillRect(x,y,1,1);
  return cache[key]=c; }
const thinAdv=ch=>{ const b=FONT_T[ch]; if(!b) return 3; let w=0; for(let i=0;i<b.length;i++) if(b[i]==='1') w=Math.max(w,i%5+1); return w+1; };
function textW(s,o={}){ const sc=o.scale||1; s=String(s).toUpperCase(); if(!o.thin) return s.length*8*sc-sc; let w=0; for(const ch of s) w+=thinAdv(ch); return (w-1)*sc; }
function text(s,x,y,o={}){ s=String(s).toUpperCase(); const sc=o.scale||1, w=textW(s,o);
  if(o.align==='c') x=Math.round(x-w/2); else if(o.align==='r') x=x-w;
  const draw=(ink,ox,oy)=>{ let cx=x; for(const ch of s){ const g=glyph(ch,ink,o.thin);
    if(g) ctx.drawImage(g,cx+ox,y+oy+(o.thin?sc:0),g.width*sc,g.height*sc); cx+=o.thin?thinAdv(ch)*sc:8*sc; } };
  if(o.shadow) draw(COL.k,sc,sc); draw(o.ink||COL.w,0,0); }
const pad0=(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');
function fmtTime(f){ const cs=Math.round(f*100/60), m=Math.floor(cs/6000), sec=Math.floor(cs/100)%60, c=cs%100;
  return m+':'+String(sec).padStart(2,'0')+'.'+String(c).padStart(2,'0'); }

/* a gold oil drop, like the game's coins */
const DROP=['...11...','..1111..','..1111..','.111111.','11111111','11111111','11111111','.111111.','..1111..'];
function drop(x,y){ ctx.fillStyle=COL.gold; DROP.forEach((r,j)=>{ for(let i=0;i<8;i++) if(r[i]==='1') ctx.fillRect(x+i,y+j,1,1); }); }
/* the game's brick ground */
function bricks(y){ for(let row=0;row<2;row++) for(let x=-16;x<W+16;x+=16){ const bx=x+(row?8:0), by=y+row*8;
  ctx.fillStyle=COL.brick; ctx.fillRect(bx,by,16,8); ctx.fillStyle=COL.peach; ctx.fillRect(bx,by,15,1); ctx.fillRect(bx,by,1,7);
  ctx.fillStyle=COL.k; ctx.fillRect(bx+15,by,1,8); ctx.fillRect(bx,by+7,16,1); } }

function panel(x,title,list,isTime){
  text(title,x+104,64,{align:'c',ink:COL.gold});
  const now=Date.now(), newest=list.reduce((m,r)=>Math.max(m,Date.parse(r.t)),0);
  for(let i=0;i<10;i++){ const y=82+i*16, r=list[i];
    // the newest entry flashes for 90 seconds after it lands
    const fresh=r && Date.parse(r.t)===newest && now-newest<90000, hl=fresh && Math.floor(t/20)%2===0;
    if(hl){ ctx.fillStyle=COL.w; ctx.fillRect(x,y-4,208,15); }
    const ink=hl?COL.k:(i===0&&r?COL.gold:COL.w);
    if(i===0&&r&&!hl) drop(x+2,y-1);
    text(pad0(i+1,2),x+14,y,{ink});
    if(r){ text(r.i,x+70,y,{ink}); text(isTime?fmtTime(r.v):pad0(r.v,6),x+200,y,{align:'r',ink}); }
    else { text('---',x+70,y,{ink:COL.gray}); text(isTime?'-:--.--':'------',x+200,y,{align:'r',ink:COL.gray}); } } }

function render(){ t++;
  ctx.fillStyle=COL.k; ctx.fillRect(0,0,W,H);
  text('LEADERBOARD',W/2,10,{align:'c',scale:3});
  text(SUB,W/2,40,{align:'c'});
  ctx.fillStyle='#303030'; ctx.fillRect(239,62,1,170);
  panel(20,'TOP SCORES',data.score,false);
  panel(252,'FASTEST TIMES',data.time,true);
  const stale=!ok && Date.now()-lastOk>15000;
  text(stale?'RECONNECTING...':'SUPER MOC BROS.  //  UPDATED LIVE',W/2,243,{align:'c',thin:true,ink:stale?COL.gold:COL.gray});
  bricks(254);
  requestAnimationFrame(render); }

async function refresh(){
  try{ const r=await fetch('/api/scores?board='+BOARD,{cache:'no-store'}); const j=await r.json();
    if(r.ok && Array.isArray(j.score)){ data=j; ok=true; lastOk=Date.now(); fails=0; } else throw 0; }
  catch(e){ ok=false; fails++; }
  setTimeout(refresh, fails?Math.min(30000,5000*fails):5000); }

function fit(){ const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  cv.style.width=W*s+'px'; cv.style.height=H*s+'px'; cv.style.left=Math.floor((innerWidth-W*s)/2)+'px'; cv.style.top=Math.floor((innerHeight-H*s)/2)+'px'; }
addEventListener('resize',fit); fit();
const full=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); };
addEventListener('keydown',e=>{ if(e.code==='KeyF') full(); }); addEventListener('click',full);
async function awake(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) awake(); }); awake();
refresh(); render();
})();
</script>
</body>
</html>
